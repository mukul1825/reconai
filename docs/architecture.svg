<svg viewBox="0 0 960 900" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5B6270" />
    </marker>
  </defs>

  <rect width="960" height="900" fill="#FAFAFA" />

  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#14161B">ReconAI — Architecture</text>

  <!-- Three input sources -->
  <g>
    <rect x="60" y="80" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
    <text x="150" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Ledger CSV</text>
    <text x="150" y="122" text-anchor="middle" font-size="11" fill="#5B6270">Internal order records</text>

    <rect x="390" y="80" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
    <text x="480" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Settlement Report CSV</text>
    <text x="480" y="122" text-anchor="middle" font-size="11" fill="#5B6270">Razorpay-aligned schema</text>

    <rect x="720" y="80" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
    <text x="810" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Bank Statement CSV</text>
    <text x="810" y="122" text-anchor="middle" font-size="11" fill="#5B6270">NEFT credits, UTR refs</text>
  </g>

  <line x1="150" y1="140" x2="150" y2="180" stroke="#5B6270" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="480" y1="140" x2="480" y2="180" stroke="#5B6270" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="810" y1="140" x2="810" y2="180" stroke="#5B6270" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Frontend -->
  <rect x="300" y="185" width="360" height="55" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
  <text x="480" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Frontend — React + Vite (Vercel)</text>
  <text x="480" y="225" text-anchor="middle" font-size="11" fill="#5B6270">Upload · Dashboard · Exceptions · Audit</text>

  <line x1="480" y1="240" x2="480" y2="280" stroke="#2451FF" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="495" y="264" font-size="10" fill="#2451FF">HTTPS · JWT</text>

  <!-- Backend -->
  <rect x="280" y="285" width="400" height="55" rx="6" fill="#FFFFFF" stroke="#2451FF" stroke-width="1.5" />
  <text x="480" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Backend — Express (Render)</text>
  <text x="480" y="325" text-anchor="middle" font-size="11" fill="#5B6270">Auth · CSV ingest · Route layer</text>

  <line x1="480" y1="340" x2="480" y2="380" stroke="#5B6270" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Matching pipeline -->
  <rect x="140" y="385" width="680" height="130" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
  <text x="480" y="408" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Matching Pipeline — pure functions, no DB dependency</text>

  <g font-size="12" fill="#14161B">
    <rect x="165" y="425" width="140" height="60" rx="5" fill="#E9F6EF" stroke="#147A52" stroke-opacity="0.3"/>
    <text x="235" y="450" text-anchor="middle" font-weight="600">Exact match</text>
    <text x="235" y="466" text-anchor="middle" font-size="10" fill="#5B6270">UTR + amount</text>

    <rect x="325" y="425" width="140" height="60" rx="5" fill="#FCF3E3" stroke="#B7791F" stroke-opacity="0.3"/>
    <text x="395" y="450" text-anchor="middle" font-weight="600">Fuzzy match</text>
    <text x="395" y="466" text-anchor="middle" font-size="10" fill="#5B6270">fee-shaped gaps</text>

    <rect x="485" y="425" width="140" height="60" rx="5" fill="#EEF2FF" stroke="#2451FF" stroke-opacity="0.3"/>
    <text x="555" y="450" text-anchor="middle" font-weight="600">Split match</text>
    <text x="555" y="466" text-anchor="middle" font-size="10" fill="#5B6270">multi-leg settlement</text>

    <rect x="645" y="425" width="140" height="60" rx="5" fill="#FBEAE9" stroke="#C0362C" stroke-opacity="0.3"/>
    <text x="715" y="450" text-anchor="middle" font-weight="600">Decision policy</text>
    <text x="715" y="466" text-anchor="middle" font-size="10" fill="#5B6270">4-way, confidence-gated</text>
  </g>

  <line x1="480" y1="515" x2="480" y2="555" stroke="#5B6270" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="495" y="539" font-size="10" fill="#5B6270">pending_review only</text>

  <!-- Agent layer -->
  <rect x="280" y="560" width="400" height="65" rx="6" fill="#FFFFFF" stroke="#E3E5E9" stroke-dasharray="4 3" />
  <text x="480" y="583" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">Agent Layer — Groq LLM</text>
  <text x="480" y="600" text-anchor="middle" font-size="11" fill="#5B6270">narrates decisions only — never makes them</text>
  <text x="480" y="616" text-anchor="middle" font-size="10" fill="#C0362C">on failure/timeout → deterministic template fallback</text>

  <line x1="480" y1="625" x2="480" y2="665" stroke="#5B6270" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- MongoDB -->
  <rect x="330" y="670" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
  <text x="480" y="693" text-anchor="middle" font-size="13" font-weight="600" fill="#14161B">MongoDB Atlas</text>
  <text x="480" y="710" text-anchor="middle" font-size="11" fill="#5B6270">Transactions · Matches · AuditLogs · Users</text>

  <!-- Legend / key guarantee -->
  <rect x="140" y="760" width="680" height="110" rx="6" fill="#FFFFFF" stroke="#E3E5E9" />
  <text x="480" y="785" text-anchor="middle" font-size="12" font-weight="600" fill="#14161B">The one rule that governs the whole system</text>
  <text x="480" y="808" text-anchor="middle" font-size="11" fill="#5B6270">recommended_action, confidence, and requires_human_approval always come from</text>
  <text x="480" y="825" text-anchor="middle" font-size="11" fill="#5B6270">deterministic code (decisionPolicy.js) — the LLM only narrates a decision already made.</text>
  <text x="480" y="848" text-anchor="middle" font-size="10" fill="#2451FF">Enforced in code and unit-tested, not just documented.</text>
</svg>
